<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Rugby Trainer"/>
  <title>Rugby Trainings-Generator</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f0;min-height:100vh;padding-bottom:2rem;}
    .app{max-width:480px;margin:0 auto;padding:1rem;}
    .hdr{background:#1D9E75;color:white;border-radius:14px;padding:1.4rem 1.25rem;margin-bottom:1rem;}
    .hdr h1{font-size:20px;font-weight:600;}
    .hdr p{font-size:13px;opacity:.85;margin-top:4px;}
    .tabs{display:flex;gap:8px;margin-bottom:1rem;}
    .tab{flex:1;padding:10px;background:white;border:1px solid #ddd;border-radius:9px;font-size:13px;font-weight:500;color:#666;cursor:pointer;text-align:center;}
    .tab.active{background:#1D9E75;color:white;border-color:#1D9E75;}
    .card{background:white;border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08);}
    label{display:block;font-size:13px;color:#666;margin-bottom:6px;}
    select,input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:9px;font-size:15px;background:#fafafa;color:#333;-webkit-appearance:none;appearance:none;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem;}
    .field{margin-bottom:1rem;}
    .field:last-child{margin-bottom:0;}
    .btn{width:100%;padding:14px;background:#1D9E75;color:white;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
    .btn:active{background:#0F6E56;}
    .phasehdr{font-size:13px;font-weight:600;color:#085041;background:#E1F5EE;border-radius:8px;padding:7px 11px;margin-bottom:6px;margin-top:8px;}
    .ex{background:#f7f7f5;border-radius:10px;margin-bottom:8px;border-left:3px solid #1D9E75;overflow:hidden;}
    .ex-hdr{padding:10px 12px 0 12px;position:relative;}
    .ex-name{font-size:14px;font-weight:600;color:#1a1a1a;padding-right:30px;line-height:1.4;}
    .atag{font-size:10px;background:#9FE1CB;color:#04342C;border-radius:8px;padding:2px 6px;margin-left:4px;font-weight:500;vertical-align:middle;}
    .autag{font-size:10px;background:#FAC775;color:#412402;border-radius:8px;padding:2px 6px;margin-left:3px;font-weight:500;vertical-align:middle;}
    .favbtn{position:absolute;top:9px;right:11px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;color:#aaa;}
    .sk-wrap{margin:8px 12px;background:white;border-radius:8px;border:1px solid #e8e8e8;overflow:hidden;cursor:pointer;}
    .sk-wrap svg{display:block;width:100%;}
    .ex-body{padding:0 12px 10px 12px;}
    .ex-desc{font-size:13px;color:#555;margin-top:5px;line-height:1.55;}
    .ex-meta{font-size:12px;color:#1D9E75;margin-top:5px;font-weight:600;}
    .ex-tip{font-size:12px;color:#999;font-style:italic;margin-top:3px;}
    .ex-src{font-size:11px;margin-top:4px;}
    .ex-src a{color:#1D9E75;text-decoration:none;}
    .acts{display:flex;gap:6px;margin-top:8px;}
    .actbtn{flex:1;padding:7px 8px;font-size:12px;border-radius:7px;border:1px solid #ddd;background:white;color:#555;cursor:pointer;text-align:center;}
    .actbtn:active{background:#f0f0f0;}
    .badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1rem;}
    .badge{font-size:12px;padding:4px 11px;border-radius:20px;background:#E1F5EE;color:#085041;font-weight:600;}
    .newbtn{width:100%;padding:12px;background:transparent;border:1.5px solid #ddd;border-radius:10px;font-size:14px;color:#666;cursor:pointer;margin-top:.75rem;}
    .hint{font-size:12px;color:#888;margin-bottom:1rem;background:#f0f0ee;border-radius:8px;padding:8px 10px;line-height:1.5;}
    .output{display:none;}
    .output.visible{display:block;}
    .cnt{font-size:12px;color:#aaa;text-align:right;margin-bottom:8px;}
    .page{display:none;}
    .page.active{display:block;}
    .fav-item{background:#f7f7f5;border-radius:10px;padding:11px 13px;margin-bottom:6px;border-left:3px solid #FAC775;display:flex;align-items:flex-start;gap:10px;}
    .fav-body{flex:1;}
    .fav-name{font-size:14px;font-weight:600;color:#1a1a1a;}
    .fav-meta{font-size:12px;color:#888;margin-top:3px;}
    .fav-rm{background:none;border:none;cursor:pointer;font-size:20px;color:#bbb;flex-shrink:0;}
    .empty{text-align:center;padding:2.5rem 1rem;color:#aaa;font-size:13px;}
    .modal-wrap{display:none;min-height:500px;background:rgba(0,0,0,.45);align-items:flex-end;}
    .modal-wrap.open{display:flex;}
    .modal-box{background:white;border-radius:16px 16px 0 0;padding:1.25rem;width:100%;max-height:65vh;overflow-y:auto;}
    .modal-title{font-size:15px;font-weight:600;margin-bottom:1rem;color:#333;}
    .modal-ex{background:#f7f7f5;border-radius:9px;padding:10px 13px;margin-bottom:6px;cursor:pointer;border:1.5px solid transparent;}
    .modal-ex:active{border-color:#1D9E75;background:#E1F5EE;}
    .modal-ex-name{font-size:14px;font-weight:600;color:#1a1a1a;}
    .modal-ex-meta{font-size:12px;color:#888;margin-top:2px;}
    .modal-close{width:100%;padding:12px;background:transparent;border:1.5px solid #ddd;border-radius:10px;font-size:14px;color:#666;cursor:pointer;margin-top:8px;}
    .err{background:#fff0f0;border:1px solid #f99;border-radius:8px;padding:10px;font-size:12px;color:#c00;margin-bottom:1rem;display:none;}
    .install{background:#fff8e1;border-radius:10px;padding:10px 13px;font-size:12px;color:#7a5c00;margin-bottom:1rem;border-left:3px solid #f0b429;line-height:1.5;}
    .install strong{font-weight:600;}
  </style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <h1>Rugby Trainings-Generator</h1>
    <p>85+ Ubungen mit Skizzen - Rugby Australia - Favoriten</p>
  </div>
  <div class="install">
    <strong>Als App speichern:</strong> Chrome-Menu (3 Punkte) dann "Zum Startbildschirm hinzufugen"
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showPage('plan')">Trainingsplan</div>
    <div class="tab" onclick="showPage('favs')">Favoriten <span id="fav-count"></span></div>
  </div>
  <div class="page active" id="page-plan">
    <div class="err" id="err"></div>
    <div class="card" id="form-card">
      <div class="row">
        <div class="field">
          <label>Altersgruppe</label>
          <select id="age">
            <option value="U6">U6 (4-5 J.)</option>
            <option value="U8" selected>U8 (6-7 J.)</option>
            <option value="U10">U10 (8-9 J.)</option>
            <option value="U12">U12 (10-11 J.)</option>
          </select>
        </div>
        <div class="field">
          <label>Anzahl Kinder</label>
          <input type="number" id="kids" value="12" min="4" max="40"/>
        </div>
      </div>
      <div class="field">
        <label>Trainingsdauer</label>
        <select id="duration">
          <option value="45">45 Minuten</option>
          <option value="60" selected>60 Minuten</option>
          <option value="75">75 Minuten</option>
          <option value="90">90 Minuten</option>
        </select>
      </div>
      <div class="field">
        <label>Schwerpunkt</label>
        <select id="focus">
          <option value="allgemein">Allgemein / gemischt</option>
          <option value="passen">Passen und Fangen</option>
          <option value="laufen">Laufen und Ausweichen</option>
          <option value="teamwork">Teamwork</option>
          <option value="koordination">Koordination</option>
        </select>
      </div>
      <button class="btn" id="genbtn" onclick="generatePlan()">Trainingsplan erstellen</button>
    </div>
    <div class="card output" id="output">
      <div class="badges" id="badges"></div>
      <div class="cnt" id="cnt"></div>
      <div class="hint">Stern = Favorit speichern - Skizze antippen = aufklappen - AU = Rugby Australia</div>
      <div id="plan"></div>
      <button class="newbtn" onclick="resetForm()">Neuen Plan erstellen</button>
    </div>
  </div>
  <div class="page" id="page-favs">
    <div class="card"><div id="fav-list"></div></div>
  </div>
</div>
<div class="modal-wrap" id="modal-wrap" onclick="closeModalBg(event)">
  <div class="modal-box">
    <div class="modal-title">Ubung aus Favoriten wahlen</div>
    <div id="modal-list"></div>
    <button class="modal-close" onclick="closeModalDirect()">Abbrechen</button>
  </div>
</div>
<script>
var AU='https://australia.rugby/participate/get-into-rugby/school-resources/videos/lower-primary/';
function fi(x,y,w,h){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#f0f7f4" stroke="#b2dfcf" stroke-width="1" rx="4"/>';}
function pl(x,y,c,l){var s='<circle cx="'+x+'" cy="'+(y-10)+'" r="6" fill="'+(c||'#1D9E75')+'" stroke="white" stroke-width="1.5"/><line x1="'+x+'" y1="'+(y-4)+'" x2="'+x+'" y2="'+(y+10)+'" stroke="'+(c||'#1D9E75')+'" stroke-width="2.5" stroke-linecap="round"/><line x1="'+(x-7)+'" y1="'+(y+2)+'" x2="'+(x+7)+'" y2="'+(y+2)+'" stroke="'+(c||'#1D9E75')+'" stroke-width="2" stroke-linecap="round"/><line x1="'+x+'" y1="'+(y+10)+'" x2="'+(x-5)+'" y2="'+(y+20)+'" stroke="'+(c||'#1D9E75')+'" stroke-width="2" stroke-linecap="round"/><line x1="'+x+'" y1="'+(y+10)+'" x2="'+(x+5)+'" y2="'+(y+20)+'" stroke="'+(c||'#1D9E75')+'" stroke-width="2" stroke-linecap="round"/>';if(l)s+='<text x="'+x+'" y="'+(y+32)+'" text-anchor="middle" font-size="9" fill="#555">'+l+'</text>';return s;}
function cn(x,y,c){var col=c||'#E85D04';return '<polygon points="'+x+','+(y-10)+' '+(x-6)+','+(y+5)+' '+(x+6)+','+(y+5)+'" fill="'+col+'" opacity="0.9"/><line x1="'+(x-7)+'" y1="'+(y+5)+'" x2="'+(x+7)+'" y2="'+(y+5)+'" stroke="'+col+'" stroke-width="1.5"/>';}
function ar(x1,y1,x2,y2,c,d){var col=c||'#1D9E75';var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy),ux=dx/len,uy=dy/len,ax=x2-ux*12,ay=y2-uy*12;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+ax+'" y2="'+ay+'" stroke="'+col+'" stroke-width="2" stroke-linecap="round" '+(d?'stroke-dasharray="5,4"':'')+'/><polygon points="'+x2+','+y2+' '+(ax-uy*5)+','+(ay+ux*5)+' '+(ax+uy*5)+','+(ay-ux*5)+'" fill="'+col+'"/>';}
function aa(x1,y1,x2,y2,cx,cy,c){var col=c||'#1D9E75';var dx=x2-cx,dy=y2-cy,len=Math.sqrt(dx*dx+dy*dy),ux=dx/len,uy=dy/len,ax=x2-ux*10,ay=y2-uy*10;return '<path d="M'+x1+','+y1+' Q'+cx+','+cy+' '+ax+','+ay+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round"/><polygon points="'+x2+','+y2+' '+(ax-uy*5)+','+(ay+ux*5)+' '+(ax+uy*5)+','+(ay-ux*5)+'" fill="'+col+'"/>';}
function bl(x,y,s){var sz=s||7;return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+sz+'" ry="'+(sz*0.65)+'" fill="#C87941" stroke="#8B5e3c" stroke-width="1"/>';}
function tg(x,y){return '<rect x="'+(x-1)+'" y="'+(y+12)+'" width="2" height="10" fill="#E85D04" rx="1"/>';}
function lb(x,y,t,c){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="9" fill="'+(c||'#666')+'">'+t+'</text>';}
function tl(x,y,w){return '<line x1="'+x+'" y1="'+y+'" x2="'+(x+w)+'" y2="'+y+'" stroke="#E85D04" stroke-width="2" stroke-dasharray="4,3"/><text x="'+(x+w/2)+'" y="'+(y-3)+'" text-anchor="middle" font-size="8" fill="#E85D04">Try-Linie</text>';}
function ci(cx,cy,r,c,d){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(c||'#1D9E75')+'" stroke-width="1.5" '+(d?'stroke-dasharray="5,4"':'')+' opacity="0.6"/>';}
function g20(){return '<rect x="20" y="20" width="260" height="120" fill="none" stroke="#b2dfcf" stroke-width="1.5" stroke-dasharray="5,3" rx="3"/>';}
var F=fi(10,10,280,140);
var SK={};
SK['Haifisch-Fangen']=F+pl(55,80,'#E85D04','Hai')+pl(150,50)+pl(220,80)+pl(130,110)+ar(70,75,130,55,'#E85D04')+ar(130,55,200,78,'#1D9E75',true)+lb(150,148,'Hai fangt alle - letztes freies Kind gewinnt');
SK['Tag-Band-Jagd']=F+pl(60,75)+tg(60,75)+pl(130,60)+tg(130,60)+pl(200,90,'#E85D04')+tg(200,90)+pl(240,55)+tg(240,55)+ar(185,85,145,65,'#E85D04')+lb(150,148,'Bander sammeln - eigenes schutzen');
SK['Menschenslalom']=F+pl(40,80,'#1D9E75','1')+pl(80,80,'#1D9E75','2')+pl(120,80,'#1D9E75','3')+pl(160,80,'#1D9E75','4')+pl(200,80,'#1D9E75','5')+pl(240,45,'#E85D04','')+aa(240,48,200,78,260,65,'#E85D04')+aa(200,78,160,78,190,60,'#E85D04')+aa(160,78,120,78,150,60,'#E85D04')+bl(245,35)+lb(150,148,'Hinteres Kind slalomt nach vorne');
SK['Verfolgungsjagd']=F+'<line x1="260" y1="15" x2="260" y2="148" stroke="#1D9E75" stroke-width="2"/>'+pl(40,80,'#1D9E75','A')+pl(25,80,'#E85D04','B')+ar(55,80,248,80,'#1D9E75')+ar(40,80,248,80,'#E85D04',true)+lb(150,145,'A hat 3 Sek. Vorsprung - B holt ein');
SK['Zombie-Ausbruch']=F+pl(120,80,'#888','Zombie')+pl(180,50,'#888','Zombie')+'<line x1="113" y1="72" x2="100" y2="72" stroke="#888" stroke-width="1.5"/><line x1="127" y1="72" x2="140" y2="72" stroke="#888" stroke-width="1.5"/>'+pl(50,80,'#1D9E75','')+bl(53,76)+ar(65,78,105,78,'#1D9E75')+lb(150,148,'Zombies haben ausgestreckte Arme - ausweichen!');
SK['Ball-Jonglage im Kreis']=F+pl(150,30)+pl(240,80)+pl(200,140)+pl(100,140)+pl(60,80)+ci(150,90,75,'#1D9E75',true)+bl(155,30)+ar(165,32,228,75,'#1D9E75')+lb(150,20,'Ball reihum passen - dann Richtung wechseln');
SK['Unters und Obers']=F+pl(40,70)+pl(90,70)+pl(140,70)+pl(190,70)+pl(240,70,'#E85D04')+bl(42,58)+'<path d="M50,75 Q68,90 80,75" fill="none" stroke="#1D9E75" stroke-width="2" stroke-dasharray="3,2"/><polygon points="80,75 73,72 75,80" fill="#1D9E75"/><path d="M100,56 Q118,38 130,56" fill="none" stroke="#E85D04" stroke-width="2"/><polygon points="130,56 123,51 125,60" fill="#E85D04"/>'+lb(60,110,'UNTERS','#1D9E75')+lb(115,42,'OBERS','#E85D04')+lb(150,148,'Ball unter Beine, dann uber Kopf');
SK['Rucken-an-Rucken Passen']=F+pl(125,70,'#1D9E75','A')+pl(175,70,'#E85D04','B')+'<line x1="131" y1="68" x2="169" y2="68" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/><path d="M115,72 Q150,50 183,72" fill="none" stroke="#1D9E75" stroke-width="2"/><polygon points="183,72 176,67 178,76" fill="#1D9E75"/>'+lb(150,148,'Seitlich, uber Kopf oder zwischen Beinen');
SK['Tierwanderungs-Staffel']=F+pl(40,80)+pl(65,80)+pl(185,80,'#E85D04')+pl(210,80,'#E85D04')+'<text x="60" y="62" text-anchor="middle" font-size="9" fill="#1D9E75">Krokodil</text><text x="200" y="62" text-anchor="middle" font-size="9" fill="#E85D04">Krabbe</text>'+ar(100,80,175,80,'#666',true)+lb(150,148,'Auf 4 Beinen zum Ziel: Krokodil, Krabbe, Bar...');
SK['Flip it']=F+cn(60,80,'#1D9E75')+cn(120,50,'#E85D04')+cn(180,110,'#1D9E75')+cn(240,60,'#E85D04')+'<polygon points="60,90 54,100 66,100" fill="#1D9E75" opacity="0.5"/><polygon points="120,60 114,70 126,70" fill="#E85D04" opacity="0.5"/>'+lb(150,130,'Team A dreht Kegel um - Team B dreht zuruck')+lb(150,148,'Wer hat nach 30 Sek. mehr Kegel?');
SK['Wallaby Wallaby Wallaroo']=F+ci(150,85,60,'#ccc',true)+pl(150,25,'#1D9E75','Es')+pl(90,65)+pl(210,65)+pl(90,115)+pl(210,115)+pl(150,145,'#E85D04','!')+'<path d="M150,133 C148,115 148,108 150,100" fill="none" stroke="#E85D04" stroke-width="2"/><polygon points="150,100 146,110 154,110" fill="#E85D04"/>'+lb(150,18,'Duck-Duck-Goose mit Rugby-Twist');
SK['Fruit Salad']=F+ci(150,85,60,'#ccc',true)+pl(150,25,'#1D9E75','Ananas')+pl(245,80,'#E85D04','Banane')+pl(200,145,'#1D9E75','')+pl(100,145,'#E85D04','')+pl(55,80)+'<text x="150" y="90" text-anchor="middle" font-size="11" fill="#E85D04">Fruit Salad!</text>'+lb(150,148,'Beim Ruf der Frucht - Platz wechseln!');
SK['Passen im Kreis']=F+pl(150,25)+pl(245,80)+pl(200,148)+pl(100,148)+pl(55,80)+ci(150,90,75,'#ccc',true)+bl(152,26)+ar(165,30,232,72,'#1D9E75')+lb(150,20,'rechtsherum - dann linksherum');
SK['Staffelpassen Viereck']=F+pl(40,35,'#1D9E75','A')+pl(240,35,'#1D9E75','B')+pl(240,118,'#E85D04','C')+pl(40,118,'#E85D04','D')+bl(43,36)+ar(55,40,225,40,'#1D9E75')+ar(245,55,245,100,'#1D9E75')+ar(225,115,60,115,'#1D9E75',true)+lb(150,155,'Passer folgt dem Ball zur nachsten Gruppe');
SK['Dreieck-Passen']=F+pl(150,25,'#1D9E75','A')+pl(60,130,'#1D9E75','B')+pl(240,130,'#1D9E75','C')+bl(153,26)+ar(145,38,75,118,'#1D9E75')+ar(80,128,225,128,'#1D9E75')+ar(232,118,160,38,'#1D9E75',true);
SK['Pass und Lauf']=F+pl(40,80,'#1D9E75','A')+pl(120,80,'#E85D04','B')+pl(220,50,'#1D9E75','')+bl(43,80)+ar(55,78,105,78,'#1D9E75')+ar(55,75,205,55,'#1D9E75',true)+lb(150,148,'A passt - lauft vor - bekommt Ruckpass');
SK['Bewegtes Seitpassen']=F+pl(40,60,'#1D9E75','A')+pl(40,100,'#E85D04','B')+pl(140,60)+pl(140,100,'#E85D04')+pl(240,60)+pl(240,100,'#E85D04')+bl(42,62)+ar(55,62,125,62,'#1D9E75')+lb(150,148,'Laufen + seitwarts passen (nie nach vorne!)');
SK['Stehend fangen Abstand wachst']=F+pl(60,80,'#1D9E75','A')+pl(150,80,'#E85D04','B')+bl(63,76)+ar(75,78,133,78,'#1D9E75')+'<line x1="60" y1="110" x2="150" y2="110" stroke="#666" stroke-width="1" stroke-dasharray="3,2"/>'+lb(105,122,'1m - 2m - 3m - 4m')+lb(150,148,'Alle 30 Sek. einen Schritt zuruck');
SK['Passen im Kreis mit Jagd']=F+pl(150,25)+pl(245,80)+pl(200,145)+pl(100,145)+pl(55,80,'#E85D04','Jager')+ci(150,90,75,'#ccc',true)+bl(152,26)+ar(165,30,232,72,'#1D9E75')+ar(48,78,80,30,'#E85D04',true)+lb(150,20,'Passen + gleichzeitig Jager ausweichen');

    {name:"Touch Sevens 4 gegen 4",desc:"4 gegen 4 auf 20x20m. Balltrager wird bei Beruhrung gestoppt und muss sofort passen. Nach 5 Beruhrungen wechselt der Ball.",meta:"4 Kegel - 20x20m - 10 Min.",tip:"Fur U10 und alter: Halbzeit nach 5 Minuten einfuhren",ages:["U10","U12"],src:AU+'skills-and-drills-module-6'},
    {name:"Menschenkette",desc:"Alle Kinder halten sich an den Handen. Die erste Person fuhrt die Kette in verschiedene Formen: Spirale, Schlange, Kreis.",meta:"Kein Material - 6 Min.",tip:"Gut fur U6/U8 als sanfte Teamubung",ages:["U6","U8"],src:''}

  koordination:[

    {name:"Reifenspringen mit Ball",desc:"Reifen oder Kegelkreise auf dem Boden auslegen. Kinder springen durch und tragen dabei den Ball unter dem Arm.",meta:"6 Reifen - 1 Ball - 8 Min.",tip:"Verbindet Koordination direkt mit rugbyspezifischem Ballhalten",ages:["U8","U10","U12"],src:''},
    {name:"Spiegel-Spiel",desc:"Zwei Kinder stehen sich gegenuber. Kind A macht Bewegungen vor. Kind B spiegelt sofort jede Bewegung. Nach 30 Sekunden tauschen.",meta:"Kein Material - 6 Min.",tip:"Fordert Reaktion und Korperwahrnehmung",ages:["U8","U10"],src:''},
    {name:"Ball-Balancieren",desc:"Kinder balancieren den Rugby-Ball auf dem Handrucken und gehen durch einen Parcours aus Kegeln. Wer den Ball fallen lasst startet neu.",meta:"1 Ball pro Kind - 7 Min.",tip:"Rugby-Balle sind oval - das macht es extra schwierig!",ages:["U6","U8","U10"],src:''},
    {name:"Krabbenrennen",desc:"Kinder gehen im Krabbengang (Rucken zum Boden, auf Handen und Fussen) von einer Linie zur anderen.",meta:"Optional Ball - 5 Min.",tip:"Kraftigt Rumpf und Schultern - viel Spass garantiert!",ages:["U6","U8","U10"],src:''},
    {name:"Ball-Vertrautheit",desc:"Jedes Kind hat einen Ball und erkundet ihn frei: Ball um den Korper fuhren, durch die Beine, uber den Kopf. Kinder erfinden eigene Tricks.",meta:"1 Ball pro Kind - 5 Min.",tip:"Freies Erkunden - kein Richtig oder Falsch!",ages:["U6","U8","U10"],src:AU+'skills-and-drills-module-4'},
    {name:"Reaktionsspiel mit Farben",desc:"Trainer halt farbige Kegel hoch: rot = stehen, grun = laufen, gelb = hupfen, blau = ruckwarts laufen. Kinder reagieren sofort.",meta:"Farbige Kegel - 8 Min.",tip:"Tempo langsam steigern",ages:["U8","U10","U12"],src:''}
  ],
  allgemein:[

    {name:"Try-Wettbewerb",desc:"Ball aufnehmen, Slalom durch 3 Kegel, Try ablegen. Zeit stoppen. Wer schafft den schnellsten Try?",meta:"Kegel - 1 Ball - 10 Min.",tip:"Alle Grundbewegungen in einem Spiel kombiniert",ages:["U6","U8","U10","U12"],src:''},
    {name:"Spiel ohne Grenzen",desc:"Freies Spiel mit Rugby-Ball. Kinder entdecken selbst wie der Ball rollt, springt und fliegt. Keine festen Regeln - nur Spass!",meta:"1 Ball pro 3 Kinder - 8 Min.",tip:"Besonders wichtig fur U6 - Begeisterung fur den Ball wecken!",ages:["U6","U8"],src:''},
    {name:"Lineout-Wurf Wettbewerb",desc:"Paare stehen sich gegenuber (5 Meter Abstand). Ball wird mit zwei Handen uber den Kopf geworfen und vom Partner gefangen. Gefangen = Schritt zuruck, fallen gelassen = Schritt vor.",meta:"1 Ball pro Paar - 2 Kegel - 5-10 Min.",tip:"Daumen oben und Finger unten beim Greifen!",ages:["U8","U10","U12"],src:AU+'skills-and-drills-module-1'},
    {name:"Lineout Count",desc:"Kinder stehen in einer Lineout-Aufstellung. Trainer ruft eine Nummer. Der Werfer versucht den Ball genau zu diesem Spieler zu werfen.",meta:"4 Kegel - 1 Ball - 5 Min.",tip:"Nummernsystem langsam aufbauen: erst 2 Spieler dann mehr",ages:["U8","U10","U12"],src:AU+'skills-and-drills-module-7'},
    {name:"Freies Tauschspiel",desc:"Kinder laufen frei auf dem Feld. Wer einen Ball hat kann ihn jederzeit weiterpassen. Niemand darf langer als 5 Sekunden den Ball halten.",meta:"3-4 Balle - 8 Min.",tip:"Fordert Ubersicht und spontanes Passen",ages:["U8","U10","U12"],src:''}
  ],
  cooldown:[
    {name:"Wer hat den Ball",desc:"Alle sitzen im Kreis. Ein Ball wird heimlich hinter dem Rucken weitergegeben. Ein Kind in der Mitte muss raten wer den Ball hat.",meta:"1 Ball - 5 Min.",tip:"Ideales letztes Spiel zum Entspannen",ages:["U6","U8","U10","U12"],src:''},
    {name:"Dehn-Kreis",desc:"Alle stehen im Kreis. Ein Kind zeigt eine Dehnubung vor, alle anderen machen nach. Reihum bis jedes Kind dran war.",meta:"Kein Material - 5 Min.",tip:"Kinder fuhlen sich verantwortlich und wichtig",ages:["U6","U8","U10","U12"],src:''},
    {name:"Mannschaftsjubel",desc:"Alle kommen in die Mitte, Hande ubereinander stapeln. Zusammen laut einen Mannschaftsruf.",meta:"Kein Material - 3 Min.",tip:"Mannschaftsnamen oder eigenen Schlachtruf einbauen!",ages:["U6","U8","U10","U12"],src:''},
    {name:"Feedback-Runde",desc:"Jedes Kind sagt kurz: Was hat mir heute Spass gemacht? Trainer gibt abschliessend kurzes Lob fur die gesamte Gruppe.",meta:"Kein Material - 5 Min.",tip:"Immer positiv beenden - letzte Eindruck bleibt!",ages:["U8","U10","U12"],src:''},
    {name:"Stille Schlange",desc:"Alle bilden eine Schlange hintereinander. Jedes Kind legt die Hande auf die Schultern des Vordermanns und gibt eine sanfte Massage. Dann umdrehen.",meta:"Kein Material - 4 Min.",tip:"Fordert Entspannung und Respekt untereinander",ages:["U8","U10","U12"],src:''},
    {name:"Rugby-Quiz",desc:"Trainer stellt einfache Rugby-Fragen. Wer zuerst die Hand hebt und richtig antwortet bekommt einen Punkt.",meta:"Kein Material - 5 Min.",tip:"Fragen altersgerecht stellen",ages:["U8","U10","U12"],src:''}

var favorites=[];
var currentPlan=[];
var currentAge='U8';
var modalTarget=null;
var sketchShown={};

try{var sf=localStorage.getItem('rugby-favs');if(sf)favorites=JSON.parse(sf);}catch(e){}

function saveFavs(){try{localStorage.setItem('rugby-favs',JSON.stringify(favorites));}catch(e){}updateFavCount();}
function isFav(name){for(var i=0;i<favorites.length;i++){if(favorites[i].name===name)return true;}return false;}
function toggleFav(exJSON){try{var ex=JSON.parse(decodeURIComponent(exJSON));if(isFav(ex.name)){var nf=[];for(var i=0;i<favorites.length;i++){if(favorites[i].name!==ex.name)nf.push(favorites[i]);}favorites=nf;}else{favorites.push(ex);}saveFavs();renderPlan();renderFavList();}catch(e){alert('Fehler: '+e.message);}}
function updateFavCount(){var el=document.getElementById('fav-count');if(el)el.textContent=favorites.length>0?'('+favorites.length+')':'';}
function filterByAge(arr,age){var r=[];for(var i=0;i<arr.length;i++){if(arr[i].ages.indexOf(age)>=0)r.push(arr[i]);}return r;}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
function pick(arr,n){return shuffle(arr).slice(0,n);}
function toggleSketch(key){sketchShown[key]=!sketchShown[key];renderPlan();}

function generatePlan(){
  try{
    document.getElementById('err').style.display='none';
    var btn=document.getElementById('genbtn');
    btn.textContent='Wird erstellt...';btn.disabled=true;
    var age=document.getElementById('age').value;
    var kids=parseInt(document.getElementById('kids').value)||12;
    var duration=parseInt(document.getElementById('duration').value)||60;
    var focus=document.getElementById('focus').value;
    currentAge=age;sketchShown={};
    var wm=Math.round(duration*0.2),mm=Math.round(duration*0.6),cm=duration-wm-mm,mc=duration>=75?3:2;
    var wp=filterByAge(DB.warmup,age),cp=filterByAge(DB.cooldown,age),mp=[];
    if(focus==='allgemein'){var p1=filterByAge(DB.passen,age),p2=filterByAge(DB.laufen,age),p3=filterByAge(DB.allgemein,age);for(var i=0;i<p1.length;i++)mp.push(p1[i]);for(var i=0;i<p2.length;i++)mp.push(p2[i]);for(var i=0;i<p3.length;i++)mp.push(p3[i]);}else if(DB[focus]){mp=filterByAge(DB[focus],age);}
    if(mp.length===0)mp=filterByAge(DB.allgemein,age);
    if(wp.length===0)wp=DB.warmup.slice(0,4);
    if(cp.length===0)cp=DB.cooldown.slice(0,3);
    var fll={allgemein:'Allgemein',passen:'Passen und Fangen',laufen:'Laufen und Ausweichen',teamwork:'Teamwork',koordination:'Koordination'};
    var fl=fll[focus]||'Allgemein';
    var gn=kids<=8?'(alle gemeinsam)':kids<=16?'('+Math.ceil(kids/4)+' Gruppen a 4)':'('+Math.ceil(kids/5)+' Gruppen a 5)';
    currentPlan=[
      {phase:'Aufwarmen - ca. '+wm+' Min. '+gn,exercises:pick(wp,2)},
      {phase:'Hauptteil - ca. '+mm+' Min. - '+fl,exercises:pick(mp,mc)},
      {phase:'Abkuhlen und Abschluss - ca. '+cm+' Min.',exercises:pick(cp,2)}
    ];
    var bd=document.getElementById('badges');
    bd.innerHTML='<span class="badge">'+age+'</span><span class="badge">'+kids+' Kinder</span><span class="badge">'+duration+' Min.</span><span class="badge">'+fl+'</span>';
    document.getElementById('cnt').textContent=(2+mc+2)+' Ubungen aus '+(wp.length+mp.length+cp.length)+' verfugbaren fur '+age;
    renderPlan();
    document.getElementById('form-card').style.display='none';
    document.getElementById('output').classList.add('visible');
    btn.textContent='Trainingsplan erstellen';btn.disabled=false;
  }catch(err){
    var btn2=document.getElementById('genbtn');btn2.textContent='Trainingsplan erstellen';btn2.disabled=false;
    var errEl=document.getElementById('err');errEl.style.display='block';errEl.textContent='Fehler: '+err.message+' - Bitte Seite neu laden.';
  }
}

function renderPlan(){
  var html='';
  for(var si=0;si<currentPlan.length;si++){
    var sec=currentPlan[si];
    html+='<div class="phasehdr">'+sec.phase+'</div>';
    for(var ei=0;ei<sec.exercises.length;ei++){
      var ex=sec.exercises[ei];
      var key=si+'-'+ei;
      var shown=sketchShown[key]?true:false;
      var fav=isFav(ex.name);
      var isAU=ex.src&&ex.src.length>0;
      var exEnc=encodeURIComponent(JSON.stringify(ex));
      var svg=getSK(ex.name);
      html+='<div class="ex"><div class="ex-hdr">';
      html+='<button class="favbtn" onclick="toggleFav(\''+exEnc+'\')">'+(fav?'&#9733;':'&#9734;')+'</button>';
      html+='<div class="ex-name">'+ex.name+'<span class="atag">'+ex.ages.join(' ')+'</span>'+(isAU?'<span class="autag">AU</span>':'')+'</div></div>';
      html+='<div class="sk-wrap" onclick="toggleSketch(\''+key+'\')">';
      if(shown){
        html+='<svg viewBox="0 0 300 165" xmlns="http://www.w3.org/2000/svg">'+svg+'</svg>';
      }else{
        html+='<svg viewBox="0 0 300 55" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="55" fill="#f0f7f4"/>'+svg+'<rect width="300" height="55" fill="white" opacity="0.65"/><text x="150" y="34" text-anchor="middle" font-size="12" fill="#1D9E75" font-weight="600">Skizze anzeigen</text></svg>';
      }
      html+='</div><div class="ex-body">';
      html+='<div class="ex-desc">'+ex.desc+'</div>';
      html+='<div class="ex-meta">'+ex.meta+'</div>';
      html+='<div class="ex-tip">'+ex.tip+'</div>';
      if(isAU)html+='<div class="ex-src"><a href="'+ex.src+'" target="_blank">Quelle: Rugby Australia</a></div>';
      html+='<div class="acts"><button class="actbtn" onclick="reroll('+si+','+ei+')">Neue Ubung</button><button class="actbtn" onclick="openModal('+si+','+ei+')">Aus Favoriten</button></div>';
      html+='</div></div>';
    }
  }
  document.getElementById('plan').innerHTML=html;
}

function reroll(si,ei){
  try{
    var focus=document.getElementById('focus').value;
    var pool=[];
    if(si===0)pool=filterByAge(DB.warmup,currentAge);
    else if(si===2)pool=filterByAge(DB.cooldown,currentAge);
    else{if(focus==='allgemein'){var p1=filterByAge(DB.passen,currentAge),p2=filterByAge(DB.laufen,currentAge),p3=filterByAge(DB.allgemein,currentAge);for(var i=0;i<p1.length;i++)pool.push(p1[i]);for(var i=0;i<p2.length;i++)pool.push(p2[i]);for(var i=0;i<p3.length;i++)pool.push(p3[i]);}else if(DB[focus]){pool=filterByAge(DB[focus],currentAge);}else{pool=filterByAge(DB.allgemein,currentAge);}}
    var used=[];for(var i=0;i<currentPlan[si].exercises.length;i++)used.push(currentPlan[si].exercises[i].name);
    var avail=[];for(var i=0;i<pool.length;i++){if(used.indexOf(pool[i].name)<0)avail.push(pool[i]);}
    if(avail.length===0){alert('Keine weiteren Ubungen verfugbar!');return;}
    currentPlan[si].exercises[ei]=avail[Math.floor(Math.random()*avail.length)];
    sketchShown[si+'-'+ei]=false;
    renderPlan();
  }catch(e){alert('Fehler: '+e.message);}
}

function openModal(si,ei){
  if(favorites.length===0){alert('Noch keine Favoriten! Tippe auf den Stern bei einer Ubung.');return;}
  modalTarget=[si,ei];
  var html='';
  for(var i=0;i<favorites.length;i++){html+='<div class="modal-ex" onclick="replaceWithFav('+i+')"><div class="modal-ex-name">'+favorites[i].name+'</div><div class="modal-ex-meta">'+favorites[i].meta+'</div></div>';}
  document.getElementById('modal-list').innerHTML=html;
  document.getElementById('modal-wrap').classList.add('open');
}
function replaceWithFav(fi){currentPlan[modalTarget[0]].exercises[modalTarget[1]]=favorites[fi];sketchShown[modalTarget[0]+'-'+modalTarget[1]]=false;renderPlan();closeModalDirect();}
function closeModalBg(e){if(e.target===document.getElementById('modal-wrap'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal-wrap').classList.remove('open');}

function renderFavList(){
  var el=document.getElementById('fav-list');
  if(favorites.length===0){el.innerHTML='<div class="empty">Noch keine Favoriten.<br>Tippe im Trainingsplan auf den Stern.</div>';return;}
  var html='';
  for(var i=0;i<favorites.length;i++){html+='<div class="fav-item"><div class="fav-body"><div class="fav-name">'+favorites[i].name+'</div><div class="fav-meta">'+favorites[i].meta+' - '+favorites[i].ages.join(', ')+'</div></div><button class="fav-rm" onclick="removeFav('+i+')">&#x2715;</button></div>';}
  el.innerHTML=html;
}
function removeFav(i){favorites.splice(i,1);saveFavs();renderFavList();renderPlan();}

function showPage(p){
  var pages=document.querySelectorAll('.page'),tabs=document.querySelectorAll('.tab');
  for(var i=0;i<pages.length;i++)pages[i].classList.remove('active');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
  document.getElementById('page-'+p).classList.add('active');
  if(p==='plan')tabs[0].classList.add('active');else{tabs[1].classList.add('active');renderFavList();}
}
function resetForm(){document.getElementById('output').classList.remove('visible');document.getElementById('form-card').style.display='block';currentPlan=[];sketchShown={};}
updateFavCount();
</script>
